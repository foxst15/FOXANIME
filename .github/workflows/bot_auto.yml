name: FoxAnime Bot Notifier

on:
  schedule:
    # Lịch trình: Bé Bot sẽ thức dậy lặp lại mỗi 5 phút
    - cron: '*/5 * * * *'
  # Cho phép FoxST-sama bấm nút chạy thử bằng tay bất cứ lúc nào
  workflow_dispatch: 

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Lấy code từ kho về máy chủ
        uses: actions/checkout@v3

      - name: 🐍 Cài đặt môi trường Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 📦 Cài đặt thư viện Firebase Admin & Resend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install resend

      - name: 🚀 Khởi động Bé Bot quét phim, gửi Mail và tạo RSS thật
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
          FIREBASE_CREDENTIALS: ${{ secrets.FIREBASE_CREDENTIALS }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          python bot.py
          python generate_real_rss.py

      - name: 💾 Bot tự động lưu RSS và Sitemap thật lên Github
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add rss.xml sitemap_v2.xml
          git commit -m "Auto: Cập nhật RSS và Sitemap từ CSDL thật" || echo "Không có thay đổi dữ liệu"
          git push