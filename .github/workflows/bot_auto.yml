name: FoxAnime Bot Notifier

on:
  schedule:
    # Lịch trình: Bé Bot sẽ thức dậy lặp lại mỗi 5 phút
    - cron: '*/5 * * * *'
  # Cho phép FoxST-sama bấm nút chạy thử bằng tay bất cứ lúc nào
  workflow_dispatch: 

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Lấy code từ kho về máy chủ
        uses: actions/checkout@v3

      - name: 🐍 Cài đặt môi trường Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 📦 Cài đặt thư viện Firebase Admin
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🚀 Khởi động Bé Bot quét phim và gửi Mail
        env:
          # Đưa chìa khóa từ két sắt Secrets vào cho Bot Python nhận diện
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
          FIREBASE_CREDENTIALS: ${{ secrets.FIREBASE_CREDENTIALS }}
        run: python bot.py
        
